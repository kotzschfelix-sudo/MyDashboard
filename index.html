<style>
:root,:root[data-theme="dark"]{--bg:#060607;--bgi:radial-gradient(900px 500px at 15% -10%,rgba(255,255,255,.09),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,255,255,.05),transparent 60%);--cd:rgba(255,255,255,.055);--cd2:rgba(255,255,255,.1);--cell:rgba(12,12,14,.82);--tx:#f3f4f6;--mu:#9ca3af;--ln:rgba(255,255,255,.13);--in:rgba(255,255,255,.07);--pop:#131418;--ac:#e8eaef;--acx:#0a0a0c;--sh:0 8px 30px rgba(0,0,0,.45)}
:root[data-theme="light"]{--bg:#eceef3;--bgi:none;--cd:#fff;--cd2:#eef0f4;--cell:#fff;--tx:#14171f;--mu:#6b7280;--ln:#dfe2e9;--in:#f5f6f9;--pop:#fff;--ac:#14171f;--acx:#fff;--sh:0 6px 20px rgba(20,23,31,.08)}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background-color:var(--bg);background-image:var(--bgi);background-attachment:fixed;color:var(--tx)}
h1,h2,h3{margin:0 0 8px}h3{font-size:15px}h2{font-size:20px}hr{border:0;border-top:1px solid var(--ln);width:100%;margin:2px 0}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--in);color:var(--tx);font:inherit}
input[type=color]{padding:2px;height:42px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}button{font:inherit}
.m{color:var(--mu)}.sm{font-size:12px}.pd{padding:20px}.gr{flex:1;min-width:0}.sp{flex:1}.sp2{flex:1}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:16px;box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.b{padding:9px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--in);color:var(--tx);cursor:pointer}
.b.p{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:600}.b.d{background:#ef4444;border-color:#ef4444;color:#fff}.b.g{background:transparent}.b.wd{width:100%;padding:11px}
.ic{background:none;border:none;color:var(--tx);cursor:pointer;font-size:18px;padding:4px 8px}.ic.bg{font-size:26px;line-height:1}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:16px;padding:16px;min-height:100vh}
.sb{display:flex;flex-direction:column;gap:12px;position:sticky;top:16px;align-self:start;height:calc(100vh - 32px);overflow:auto}
.ctr{display:flex;flex-direction:column;gap:16px;min-width:0}.rt{display:flex;flex-direction:column;gap:16px;min-width:0}

function render(){const app=$('#app');

 for(let i=1;i<=14&&next.length<6;i++){const k=key(ad(now,i));on(k).forEach(e=>{if(next.length<6)next.push([e,k])})}

 const act=S.periods.filter(p=>tk>=p.start&&tk<=p.end),dk=isD();

<div class="cols"><div class="col"><div class="card"><h3>${ico('cal',16)} Heute</h3>${today.length?today.map(e=>evrow(e)).join(''):'<p class="m sm">Heute stehen keine Termine an.</p>'}<a class="b wd" href="${CAL_URL}">Kalender öffnen</a></div>

<div>${S.dash.announcement?.enabled&&S.dash.announcement.text?'<div class="notice">'+esc(S.dash.announcement.text)+'</div>':''}${S.dash.maintenance?.enabled&&S.dash.maintenance.message?'<div class="notice">Wartung: '+esc(S.dash.maintenance.message)+'</div>':''}</div>

 return`<div class="aw"><div class="card au"><img class="alogo" src="${IMG_D}" alt="MyDigital"><p class="m">${tt}</p>
${m=='register'?'<input id="un" placeholder="Benutzername (a–z, 0–9, _)" autocapitalize="none" autocomplete="username">':''}
${m!='newpw'?'<input id="em" type="email" placeholder="E-Mail" autocomplete="email">':''}

${S.err?`<div class="er">${esc(S.err)}</div>`:''}${S.info?`<div class="sm m">${esc(S.info)}</div>`:''}
<button class="b p" data-a="auth">${{login:'Anmelden',register:'Registrieren',reset:'Link senden',newpw:'Passwort speichern'}[m]}</button>

const A={th(el){S.set.theme=el.dataset.id;apply();saveSet();render()},out(){sb.auth.signOut()},adminOpen(){S.adminOpen=true;render()},adminClose(){S.adminOpen=false;render()},async adminSave(){const cfg={apps:{},announcement:{enabled:!!$('#ann_on')?.checked,text:$('#ann_text')?.value||''},maintenance:{enabled:!!$('#maint_on')?.checked,message:$('#maint_text')?.value||''}};for(const a of APPS)cfg.apps[a[0]]={visible:!!$('#vis_'+a[0])?.checked,url:$('#url_'+a[0])?.value.trim()||''};const{data,error}=await sb.rpc('mydigital_admin_save_config',{p_config:cfg});if(error){alert('Speichern fehlgeschlagen: '+error.message);return}S.dash=data||cfg;alert('Admin-Einstellungen gespeichert.');render()},
async roleFind(){const n=$('#role_username')?.value.trim();if(!n)return alert('Bitte einen Benutzernamen eingeben.');const{data,error}=await sb.rpc('mydigital_admin_find_user',{p_username:n});if(error){S.roleUser=null;$('#role_result').style.display='block';$('#role_result').textContent=error.message;$('#role_controls').style.display='none';return}S.roleUser=data;$('#role_result').style.display='block';$('#role_result').textContent='Gefunden: '+data.username;$('#role_controls').style.display='flex';$('#role_premium').checked=!!data.premium;$('#role_admin').checked=!!data.admin},

 async auth(){S.err='';S.info='';const m=S.mode,em=($('#em')||{}).value?.trim(),pw=($('#pw')||{}).value||'',un=(($('#un')||{}).value||'').trim().toLowerCase();
  try{
   if(m=='register'){if(!/^[a-z0-9_]{3,20}$/.test(un))throw'Benutzername: 3–20 Zeichen, nur a–z, 0–9 und _.';if(pw.length<8)throw'Das Passwort braucht mindestens 8 Zeichen.';
    const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{username:un},emailRedirectTo:location.href.split('#')[0]}});if(error)throw error.message;

  if(!(m=='login'&&!S.err&&!S.info))render()}};

 S.user={id:u,name:(p.data&&p.data.username)||ses.user.email};S.prem=!!(p.data&&p.data.premium);S.admin=ad.data===true;S.dash={...DEFAULT_DASH,...(cfg.data?.config||{})};S.set=(st.data&&st.data.data)||{};
